<style>
/* One visual world: an alpine night. Slate rock, snow text, alpenglow for the next step, glacier ice for information. */
:root {
  --night: #0e1418;   /* sky and page */
  --slate: #151e24;   /* cards */
  --scarp: #1d2932;   /* raised controls */
  --ridge: #2a3a45;   /* contour lines and borders */
  --snow: #e9efe9;    /* text */
  --scree: #93a5ab;   /* secondary text */
  --glow: #ff8a5c;    /* alpenglow: the next action, the open trail */
  --ice: #7fd4e6;     /* glacier: information and links */
  --moss: #8fcf7a;    /* mastered */
  --amber: #f2c14e;   /* eroding, fuel */
  --red: #ef6a6a;     /* wrong, destructive */
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html { background: #0e1418; }
#boot { height: 100%; display: grid; place-items: center; color: #93a5ab; font: 600 14px system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
</style>
